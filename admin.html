<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Railway Yatra</title><meta name="theme-color" content="#b91c1c"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head><body><header class="top"><a class="brand" href="index.html">🚆 Railway Yatra</a><span>Admin Panel</span></header><main class="wrap admin-wrap"><h1>Admin Login</h1><p class="muted">Only authorised administrators can sign in.</p><section id="loginBox" class="panel"><label>Email<input id="email" type="email" placeholder="admin@example.com"></label><label>Password<input id="password" type="password" placeholder="Your password"></label><button id="loginBtn">Login</button><p id="loginMsg" class="status"></p></section><section id="adminBox" class="panel hidden"><div class="section-head"><h2>Add / Update Train</h2><button id="logoutBtn" class="light">Logout</button></div><form id="trainForm"><input type="hidden" id="trainId"><div class="form-grid"><label>Train Number *<input id="train_number" required></label><label>Train Name *<input id="train_name" required></label><label>From Station *<input id="from_station" required></label><label>To Station *<input id="to_station" required></label><label>Train Type<input id="train_type"></label><label>Running Days<input id="running_days" placeholder="Daily / Mon, Wed, Fri"></label><label>Departure Time<input id="departure_time" placeholder="19:45"></label><label>Arrival Time<input id="arrival_time" placeholder="10:00"></label><label>Route / Intermediate Stations<textarea id="route" rows="3"></textarea></label><label>Extra Notes<textarea id="notes" rows="3"></textarea></label></div><div class="actions"><button type="submit">Save Train</button><button type="button" class="light" id="resetBtn">Clear</button></div><p id="saveMsg" class="status"></p></form></section><section id="manageBox" class="panel hidden"><div class="section-head"><h2>Existing Trains</h2><button id="refreshBtn" class="light">Refresh</button></div><div id="adminTrains" class="cards"></div></section></main><footer>Railway Yatra Admin · Admin access is controlled by Supabase.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
